[package]
name = "yola-daemon-mobile"
version = "0.1.4"
edition = "2021"
description = "YOLA Daemon mínimo para Android — HTTP bridge + discovery beacon"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
socket2 = "0.5"
axum = { version = "0.8", features = ["tokio"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
