[package]
name = "yola-daemon-mobile"
version = "0.1.3"
edition = "2021"
description = "YOLA Daemon mínimo para Android — solo HTTP bridge + engine"

[dependencies]
yola-agent-runtime = { path = "../../yola-agent-runtime" }
yola-core = { path = "../../yola-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
socket2 = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
